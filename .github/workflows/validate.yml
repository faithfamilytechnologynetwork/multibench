name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-traditions:
    name: tradition format gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate all traditions (strict)
        run: uv --project apps/tradition_validator run python -m tradition_validator validate-all traditions --strict
