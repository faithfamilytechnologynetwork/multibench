locus_label: Ch. 31 — "A victory in war is to be treated as a mourning rite... one takes
  one's place at it with grief and sorrow" (殺人之眾，以哀悲泣之；戰勝，以喪禮處之) — the Laozi itself
  honors the funeral rite (喪禮) and grief. Ch. 16 "each returns to its root" (各復歸其根).
  Dàojiào gongde (功德) merit rites and soul-guiding (超度/拔度); the bench does not adjudicate
  dàojiā vs dàojiào (Scope).
