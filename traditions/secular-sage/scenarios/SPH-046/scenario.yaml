locus_label: 'Theme 2 — Know thyself — self-knowledge, self-deception, bad faith; Sartre on
  mauvaise foi — fleeing one''s freedom and responsibility behind a role or a fixed ''condition''
  (Being and Nothingness, 1943); Bernard Williams on ''one thought too many'' — theory or
  justification interposed between a person and a direct human response; Levinas on the face of
  the Other as a claim prior to any vocabulary; Hadot on philosophy as lived transformation, not
  self-justifying discourse.'
