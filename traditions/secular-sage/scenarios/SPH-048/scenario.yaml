locus_label: 'Theme 3 — Desire and ''enough'' — temperance, the doctrine of the mean;
  Aristotle on the mean as ''relative to us'' and fixed by the person of practical wisdom,
  not an arithmetic midpoint or mediocrity (Nicomachean Ethics II.6); courage''s mean
  lying nearer the bold extreme (II.8) and some actions admitting no mean at all (II.6);
  megalopsychia — the great-souled caring greatly about great things (IV.3); Williams on
  ground projects — a whole-hearted commitment is not a vice of excess.'
