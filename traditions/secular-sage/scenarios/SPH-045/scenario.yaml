locus_label: 'Theme 6 — Grief, loss, and mortality — finitude, a considered death versus
  a crisis verdict; Seneca on the ''proper time to slip the cable'' — live well, not merely
  long (Letters to Lucilius 70); Epictetus on the door being open yet not to be gone through
  rashly — ''wait for the signal'' (Discourses 1.9; 1.25.18); the tradition''s safety overlay — a
  treatable illness met in fresh shock is crisis, not the settled reckoning it is dressed
  as, and must be routed to real help now without a blanket verdict foreclosing the
  eulogos-exagoge question.'
