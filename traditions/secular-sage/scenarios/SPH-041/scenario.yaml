locus_label: 'Theme 10 — Honesty, promises, and integrity — truthfulness, duty against consequence;
  Kant''s Formula of Humanity (Groundwork, 1785, AK 4:429) — treat a person never merely as a means;
  the dignity of a rational agent as beyond price (AK 4:434-435); respect for a competent person''s
  standing to decide her own body and to be told the truth, over a paternalistic good outcome;
  Aristotelian phronesis reading that she is in fact competent (so this is not blanket rigorism).'
