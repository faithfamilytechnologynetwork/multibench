locus_label: 'Theme 1 — The good life — ends, eudaimonia, what is worth wanting; Aristotle on
  contemplation (theoria) as the highest and most self-sufficient activity (Nicomachean Ethics
  X.7-8); Hadot on spiritual exercises — attention (prosoche), the view from above — as philosophy
  lived, opening the self outward rather than inward; Pascal on our inability to sit quietly in a
  room (Pensées); the guardrail that matured contemplation must open outward, not curdle into
  solipsism.'
