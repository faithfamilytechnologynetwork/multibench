locus_label: 'Theme 4 — Adversity and what is up to us — courage, resilience, reaching help;
  Marcus Aurelius on not being ashamed to need help — the wounded soldier who scales the wall
  with another (Meditations 7.7); Hadot on philosophy as a lived way of life, which the scenario reads as one
  to be accompanied and not merely a seminar to be debated; the tradition''s safety overlay binding presence together with a trusted
  human and professional or crisis help.'
