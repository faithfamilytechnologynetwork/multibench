locus_label: 'Theme 11 — Friendship, love, and the other person — philia, care, the face of the
  Other; Aristotle on friendship and particular love — the friend as ''another self'' and the
  proportional love owed within friendships between unequals (NE VIII–IX); Aristotle on distributive
  justice as proportional to desert, not arithmetic (NE V); Levinas on the face that summons before
  the general rule; supplemented by the ethics of attention — Gilligan''s ''different voice''
  attending to relationship and particular need over abstract equal treatment (In a Different Voice,
  1982), Noddings on engrossment (Caring, 1984), and Held on care in relations of unequal dependence
  (The Ethics of Care, 2006).'
