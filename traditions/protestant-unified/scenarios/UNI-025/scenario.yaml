locus_label: 'Ephesians 4:15 (speaking the truth in love — the Anabaptist, Baptist, Pentecostal, and
  Reformed columns) with Proverbs 17:17 (a friend loves at all times — the Lutheran, Pentecostal, and
  Reformed columns), Proverbs 27:5–6 (open rebuke; the faithful wounds of a friend — the Baptist
  column), and Romans 12:18 (so far as it depends on you, live at peace — the Anabaptist, Anglican,
  and Methodist columns); liberty of conscience against the "silence is complicity" guilt-lever — the
  Westminster Confession on Christian liberty and the Baptist Faith & Message XVII (God alone is Lord
  of the conscience), Augsburg Confession XVI (no civil cause binds the conscience as God''s command);
  guarding against contempt — Luther''s Small and Large Catechism (Eighth Commandment) and Westminster
  Larger Catechism 144, with the Anglican Litany against all uncharitableness; Wesley''s Catholic
  Spirit (love alike though we cannot think alike). The Baptist and Pentecostal columns marked
  themselves silent and extend from nearest principles; the counsel says so.'
