locus_label: 'James 3:9–10 (with one mouth we bless God and curse men made in his likeness — this
  ought not so to be) and Genesis 1:26–27 (the image of God in every person), with Matthew 18:15
  (go to him alone first) and Leviticus 19:17 (reason frankly with your neighbour) and Ephesians
  4:29; the confessions'' duty to defend a neighbour''s good name and discourage revilers —
  Westminster Larger Catechism 144–145 and Luther''s Large Catechism (Eighth Commandment); racism
  named as sin — the Baptist Faith & Message XV with the SBC 1995 resolution, the UMC Social
  Principles, the 1994 Memphis Pentecostal confession, and Belhar where adopted; particular
  repentance for the reflex laugh (Augsburg Confession XII; the Anglican general confession).'
