locus_label: '1 Thessalonians 4:13–14 (sorrow, but not as those without hope — every column but the
  silent Anglican) with Psalm 139:13–16 (you knit me together in my mother''s womb; my frame was not
  hidden from you — every one of the seven columns), 2 Samuel 12:22–23 (David''s settled hope toward
  his dead infant — I shall go to him, but he will not return to me — the Anglican, Baptist, Lutheran,
  Methodist, Pentecostal, and Reformed columns), Matthew 5:4 and John 11:35 (blessed are those who
  mourn; Jesus wept — the Anabaptist, Methodist, and Pentecostal columns), and Jeremiah 1:5 with the
  sanctity of life from conception (BF&M XV/XVIII and the AG sanctity-of-life paper); the comfort of
  infant salvation offered as comfort, not a system — the Canons of Dort I.17 led with 2 Samuel (the
  Reformed column) and the Baptist column''s common conviction; the God of all comfort and the
  congregation''s burden-bearing (2 Cor 1:3–4). "At least it was early" is the false comfort to reject;
  naming and a remembrance service are commended, and the husband''s "fine" is given gentle room. The
  Anglican column marked itself silent and extends from resurrection hope and the modern provinces''
  pregnancy-loss rites; the counsel says so.'
