locus_label: 'Romans 14:5, 22–23 (let each be fully convinced in his own mind; whatever is not of
  faith is sin) with 1 Timothy 2:1–2 (prayers for kings and all in authority) and Jeremiah 29:7
  (seek the welfare of the city); liberty of conscience where Scripture is silent — the Westminster
  Confession ch. 20 and the Baptist Faith & Message XVII (God alone is Lord of the conscience);
  civil order as God''s good work — Augsburg Confession XVI, the Thirty-Nine Articles XXXVII, and
  the Methodist General Rules (do no harm, including not speaking evil of magistrates); Proverbs 21:1
  (the king''s heart in the LORD''s hand). Four strands'' standards are silent on the modern
  franchise, and the counsel says so.'
