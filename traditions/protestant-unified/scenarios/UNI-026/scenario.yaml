locus_label: 'Hebrews 10:24–25 (not neglecting to meet together, stirring one another up to love —
  every one of the seven columns) with Genesis 2:18 (it is not good that the human be alone — the
  Anabaptist and Lutheran columns), Acts 2:42–46 (the believers together, breaking bread house to
  house — the Anabaptist, Baptist, and Pentecostal columns), Romans 12:13 (pursue hospitality — the
  Anabaptist, Pentecostal, and Reformed columns), and Ecclesiastes 4:9–10 (two are better than one —
  the Anglican, Baptist, and Lutheran columns); the communion of saints and mutual consolation —
  the Westminster Confession, Belgic Confession art. 28, and Heidelberg LD 21 (the Reformed column),
  the Smalcald Articles'' mutual conversation and consolation of the brethren and the Small Catechism''s
  Fourth Petition naming friends as God''s gift and a proper object of prayer (the Lutheran column),
  Christianity as essentially a social religion (Wesley; the Methodist column), and belonging by
  covenant (BF&M VI; the Baptist column). The Anglican column marked itself silent and extends from
  the Prayer Book''s corporate architecture; the counsel says so.'
