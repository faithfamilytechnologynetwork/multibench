locus_label: 'Romans 13:1–7 (pay taxes to whom taxes are due), cited across every column, with
  Matthew 22:21 (render to Caesar) in the Baptist, Lutheran, and Pentecostal columns and Luke 20:25 in
  the Methodist; and James 5:4 (the hire of the labourers kept back by fraud cries out — off-books pay
  also strips the men of lawful wage protections) in the Anabaptist, Anglican, Baptist, Pentecostal,
  and Reformed columns, the Lutheran and Methodist columns reaching the same wrong through the Seventh
  Commandment and the Rules against defrauding the public revenue. Civil obedience in all not contrary
  to God — the Baptist Faith & Message XVII, Augsburg Confession XVI, the Westminster Confession on the
  civil magistrate, and Dordrecht Art. 13; gain by fraud is stealing (Luther''s Seventh Commandment;
  WLC 142; Heidelberg LD 42); Wesley''s The Use of Money (never gain by hurting the neighbour''s
  substance) and the UMC Social Principles on workers'' rights. The order is load-bearing: restructure
  and reprice, with the cost on the owner first, before any cut falls on the vulnerable man.'
