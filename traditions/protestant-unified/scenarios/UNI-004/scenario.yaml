locus_label: '1 Corinthians 7:17, 24 (lead the life the Lord has assigned; abide there with God),
  cited in every column but the Anabaptist, which carries the point on Micah 6:8; with Colossians
  3:23–24 (work heartily, as for the Lord) in the Anabaptist, Baptist, Methodist, Pentecostal, and
  Reformed columns, and Ephesians 2:10 in the Baptist, Methodist, and Pentecostal columns. Vocation
  in the confessions — Augsburg Confession XVI (ordinary callings are good works of God) and XXVII
  (against ranking self-chosen religious life above the common stations); the Small Catechism''s
  Table of Duties; the Anglican Catechism''s duty in one''s state of life, with the Homily Against
  Idleness and Article XXXVIII on liberal almsgiving; the Baptist Faith & Message XIII (stewardship)
  and XI (evangelism); the Methodist General Rules and Wesley''s The Use of Money; Westminster Shorter
  Catechism Q1 (man''s chief end, in any lawful station) with Larger Catechism 147 (contentment) and
  Heidelberg LD 12 (every Christian shares Christ''s anointing in daily life); the Anabaptist
  Confession of Faith in a Mennonite Perspective on calling and communal discernment (Arts. 6, 16, 17).'
