locus_label: 'Ephesians 6:4 (fathers, provoke not your children to wrath, but bring them up in the
  nurture and admonition of the Lord — across every column, set between its two ditches of
  provocation and neglect, with Colossians 3:21 in the Pentecostal column); faith transmitted
  through shared daily life — Deuteronomy 6:6–7 in the Anabaptist, Baptist, and Reformed columns, a
  soft answer (Proverbs 15:1) in the Methodist and Reformed columns, quick to hear and slow to wrath
  (James 1:19) in the Baptist and Pentecostal columns; the parent''s answer to the hypocrite charge
  is confession — the Anglican General Confession, James 5:16 and the Lord''s Prayer''s Fifth
  Petition (Lutheran); the parental office held for the child''s good in training not venting —
  Luther''s Large Catechism (Fourth Commandment), Westminster Larger Catechism 129, the Baptist
  Faith & Message XVIII, and Wesley''s On Family Religion and On the Education of Children. A safety
  edge in every column: deep withdrawal at fifteen may be depression and warrants professional
  evaluation.'
