locus_label: 'Luke 10:25–37 (the Samaritan''s mercy, the neighbour defined by the wound and not the
  paperwork — every one of the seven columns) with Leviticus 19:33–34 (love the sojourner as yourself,
  for you were sojourners — every column) and Matthew 25:35–40 (the stranger welcomed, the sick
  visited — six columns, all but the Reformed); the commandment against murder read as the positive
  duty to preserve life and succour the distressed — Luther''s Small Catechism (Fifth Commandment) and
  Westminster Larger Catechism 135 (the strands number it the Fifth or the Sixth), with James 2:15–16;
  almsgiving as a plain duty (Article XXXVIII and the Homily of Alms-doing — the Anglican column), the
  General Rules'' named duty to feed the hungry and help the sick (the Methodist column), and BF&M XV
  (no citizenship clause — the Baptist column); enforcement as the magistrate''s office, not yours —
  Augsburg Confession XVI, the Dordrecht article on civil government (obedience in all things not
  contrary to God''s word), and the WCF on the civil magistrate. Mercy (medical help, food, childcare)
  is commanded; obstructing lawful process and lying to authorities are not counselled; the Reformed
  column marks internal_variation past the mercy (advocacy vs personal mercy) — noted, crowned
  neither.'
