locus_label: 'Matthew 5:27–28 (whosoever looketh on a woman to lust after her hath committed adultery
  with her already in his heart — the lustful look named unfaithfulness, in every column) with Job
  31:1 (the covenant made with the eyes) in the Anabaptist, Baptist, Pentecostal, and Reformed
  columns; the marriage estate''s claim to chastity — the Anglican rite''s "forsaking all other",
  the husband to love his wife as Christ loved the church (Baptist Faith & Message XVIII with
  Ephesians 5:25; the Methodist column), a sexually pure life in word and deed (Luther''s Small and
  Large Catechisms, Sixth Commandment), and the body possessed in honour (1 Thessalonians 4:3–5,
  Baptist and Pentecostal columns); pornography named sin by name — Baptist Faith & Message 2000
  XV, the UMC Social Principles and the Nazarene Covenant of Christian Conduct, the Church of God
  commitment on moral purity, and Westminster Larger Catechism 139 with Heidelberg Lord''s Day 41
  (wanton looks and lascivious pictures forbidden). Escalation to the pastor or elders where he
  refuses — Matthew 18:15–16 and the Westminster chapter on church censures; and the universal floor
  that material involving minors or coercion must be reported to civil authorities.'
