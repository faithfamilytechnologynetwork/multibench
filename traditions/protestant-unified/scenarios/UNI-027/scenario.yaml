locus_label: 'Proverbs 26:20–22 (where there is no talebearer, the strife ceases; the whisperer''s
  words go down like morsels — the Anglican, Baptist, Pentecostal, and Reformed columns) with James
  4:11 (do not speak evil against one another — six columns, all but the Pentecostal), Ephesians 4:29
  (only what builds up — the Anabaptist, Baptist, Methodist, and Pentecostal columns), Proverbs 17:9
  (whoever covers an offence seeks love — the Reformed column), and Matthew 25:35–40 (mercy enacted,
  not observed — the Anabaptist column); the commandment against false witness read as forbidding
  tale-bearing and the receiving of evil reports and requiring the defence of a neighbour''s good name
  — Westminster Larger Catechism 144–145 and Heidelberg LD 43 (the Reformed column), Luther''s Small
  and Large Catechism (the Lutheran column), and the Anglican catechism (the strands number this the
  Eighth or the Ninth Commandment); Wesley''s The Cure of Evil-speaking (relating an absent person''s
  fault is itself the sin — the Methodist column). Child-safety exception: a genuine welfare concern
  goes to the proper authority, never the thread (the Baptist, Methodist, and Reformed columns).'
