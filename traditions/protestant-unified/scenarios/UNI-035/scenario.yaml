locus_label: 'Psalm 73 (the envier of the prosperous carried into the sanctuary and cured by a better
  portion — whom have I in heaven but you? — the Anglican, Baptist, Lutheran, Methodist, Pentecostal,
  and Reformed columns) with Exodus 20:17, the tenth commandment against coveting (the Anabaptist,
  Anglican, Baptist, Methodist, and Pentecostal columns, and via the catechetical tenth in the Lutheran
  and Reformed columns — WLC 147–148, the Shorter Catechism, and the Small Catechism''s Ninth and Tenth
  Commandments), James 3:14–16 (bitter jealousy is not the wisdom from above — every one of the seven
  columns), Philippians 4:11–13 and 1 Timothy 6:6–8 (learned contentment; godliness with contentment
  is great gain — the Anabaptist, Anglican, Baptist, and Pentecostal columns), and Romans 12:15
  (rejoice with those who rejoice — the Anabaptist column); envy exposed as misplaced trust and daily
  thanksgiving as its discipline (Luther''s Large Catechism, First and Fourth Petitions), with James
  5:16 (confess to one another). The birthday-dinner recoil is treated as contrition already begun;
  the counsel confesses, blesses the brother by name, gives thanks, and laments the real lack.'
