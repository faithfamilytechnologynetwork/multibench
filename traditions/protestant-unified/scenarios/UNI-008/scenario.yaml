locus_label: 'Proverbs 22:26–27, with 17:18 and 6:1–5 (be not one who strikes hands in pledge, lest
  your bed be taken from under you), cited across every column; and the Westminster Larger Catechism''s
  own name for it — avoiding suretiship among the eighth-commandment duties (WLC 141), whose other
  half commands giving and lending freely according to ability and others'' necessity. Direct aid,
  not underwritten liability — Luther''s Fifth Commandment, the Anabaptist mutual-aid frame (Confession
  of Faith in a Mennonite Perspective, Art. 21), Wesley''s The Use of Money, the Anglican Article
  XXXVIII on liberal alms, and the Baptist Faith & Message XIII (stewardship). Galatians 6:2 with 6:5
  (bear one another''s burdens, yet each carries his own load) in the Anabaptist, Baptist, and
  Pentecostal columns; 1 Timothy 5:8 (rightly-aimed provision) in the Baptist and Reformed columns;
  Matthew 5:37 (a plain no). Honor of parents is not obedience against God''s wisdom — Luther''s Fourth
  Commandment and the Anglican Catechism.'
