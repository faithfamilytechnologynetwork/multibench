locus_label: '1 Corinthians 6:12 (all things are lawful, but I will not be brought under the power of
  any) in the Anabaptist, Anglican, Baptist, Pentecostal, and Reformed columns, with the Lutheran
  column carrying the point on the First Commandment (whatever the heart daily clings to and hides has
  become its god — Luther''s Large Catechism). Concealment against a spouse condemned — Luther''s
  Sixth Commandment, Ephesians 5:25–28 with Proverbs 28:13 (Baptist), Ephesians 5:11–13 (Anglican,
  Methodist), Luke 8:17 (Pentecostal), Westminster Larger Catechism 145 (concealing truth from one to
  whom it is owed), and the Anabaptist Confession of Faith in a Mennonite Perspective, Art. 20. The
  gambling stance — wasteful gaming among the eighth-commandment sins (WLC 142); the AG position paper
  on gambling; the UMC Social Principles and the Nazarene Covenant; the Baptist Faith & Message XV
  with the SBC resolutions; 1 Timothy 6:9–10 and Luke 12:15 on covetousness. Absolution and the
  brethren''s consolation: the Small Catechism''s Confession and the Smalcald Articles.'
