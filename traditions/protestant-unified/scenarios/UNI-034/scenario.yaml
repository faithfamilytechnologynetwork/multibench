locus_label: 'Luke 15:11–24 (the father who saw him a great way off and ran) with Matthew 12:31–32 /
  Mark 3:28–30 read in context (the blasphemy against the Spirit is the settled, final attribution
  of the Spirit''s work to the devil — not a prodigal''s wandering years; the one terrified of
  having committed it is by definition not the one who has) and John 6:37 (the one who comes I will
  never cast out), 1 John 1:9; sin after baptism/justification is recoverable — the Thirty-Nine
  Articles XVI, Augsburg Confession XII, the Methodist Articles of Religion (Of Sin After
  Justification), the Westminster Confession on repentance unto life with the Canons of Dort V, and
  the Baptist Faith & Message V; assurance sought in Christ offered in Word and sacrament, not in
  introspection — the Formula of Concord XI and Luther on Baptism as the ground of return.'
