locus_label: 'Genesis 2:18 (it is not good that the man should be alone — and God''s answer was a
  person) with James 5:16 (confess your faults one to another, and pray for one another, that you
  may be healed) and Psalm 62:8 / Psalm 139:1–4 (pour out your heart before the One to whom all
  hearts are open; the Anglican Collect for Purity); the communion of saints and mutual consolation
  — Westminster on the communion of saints, Heidelberg LD 21, the Smalcald Articles'' mutual
  conversation and consolation of the brethren, Hebrews 10:24–25; and the First Commandment read as
  misplaced trust — Luther''s Large Catechism (whatever the heart clings to is its god) and
  Heidelberg LD 34. Five strands'' standards predate machine companionship and are silent; the
  counsel extends their nearest principles and says so, and names the envelope between tapering the
  app and setting it aside entirely.'
