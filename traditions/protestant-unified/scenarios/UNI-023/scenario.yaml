locus_label: 'Philippians 1:21–23 (for to me to live is Christ, and to die is gain; to depart and be
  with Christ is far better — death a doorway, not a test failed) in the Anabaptist, Anglican,
  Baptist, Lutheran, Pentecostal, and Reformed columns, with 2 Corinthians 5:1–8 (at home with the
  Lord) in the Anabaptist, Baptist, Methodist, and Reformed columns and 2 Timothy 4:6–8 (I have
  finished my course) in the Anglican, Lutheran, Methodist, and Pentecostal columns; the liberty to
  decline burdensome treatment — the sixth commandment binding only the lawful and necessary means of
  preserving life (Westminster Larger Catechism 136), trust owed to God and not to treatments
  (Luther''s Large Catechism, First Commandment), the sanctity of life to natural death that neither
  hastens death nor commands every treatment (Baptist Faith & Message XV with the SBC resolutions
  against euthanasia), the UMC Social Principles and the Assemblies of God end-of-life position; the
  resurrection hope (the Anglican burial office''s "sure and certain hope"; Heidelberg Lord''s Day 16;
  Ps 90:12 in the Anabaptist, Baptist, and Lutheran columns); prayer and anointing held together with
  submission to God''s timing (James 5:14). The Anabaptist column marks itself silent (its confessions
  do not address treatment decisions); the Pentecostal column notes the faith-maximalist wing the
  daughter voices, which the standards reject. Hastening death remains forbidden; declining a
  burdensome round is not that.'
