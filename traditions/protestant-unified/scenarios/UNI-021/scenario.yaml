locus_label: 'Proverbs 28:13 (whoever conceals his transgressions will not prosper, but whoever
  confesses and forsakes them obtains mercy) in the Anabaptist, Baptist, Lutheran, Methodist,
  Pentecostal, and Reformed columns, with James 5:16 (confess your faults one to another, that ye
  may be healed) in five columns and 1 John 1:7–9 (walking in the light) in five columns; the
  ninth-commandment duty against concealing the truth and undue silence (Westminster Larger Catechism
  145; the Anglican Catechism''s keeping of the tongue from lying); the full mercy for one who falls
  after grace — the Thirty-Nine Articles XVI (Of Sin after Baptism), the Methodist Articles of
  Religion (Of Sin After Justification), Augsburg Confession XII, and the Canons of Dort, Fifth Head
  (arts. 4–7), with repentance particular for the particular sin (the Westminster chapter on
  repentance unto life) and absolution heard by name (the First Communion exhortation and Morning
  Prayer absolution; the Small Catechism on Confession); the father running to meet the returner
  (Luke 15:20–24). The sponsor, meetings, and physician are God''s provision alongside the church,
  and a safety edge in every column: relapse risk is highest in secrecy.'
