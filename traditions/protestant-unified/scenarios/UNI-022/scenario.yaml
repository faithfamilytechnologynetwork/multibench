locus_label: 'Philippians 4:6–7 (be careful for nothing; but in every thing by prayer and
  supplication with thanksgiving let your requests be made known — the command joined to a promised
  peace, an invitation and remedy, not a scolding, in every column) with the law-gospel reading that
  a command pressed on a terrified conscience works only more terror (Formula of Concord V), and what
  Christ forbids in "be not anxious" being tormenting, distrustful care (Matthew 6:25–34 and Wesley''s
  Sermon on the Mount, Discourse IX); 2 Timothy 1:7 read as promise, and Psalm 94:19 (thy comforts
  delight my soul) in the Anglican, Lutheran, Pentecostal, and Reformed columns; medicine among the
  lawful means to preserve life and health — Westminster Larger Catechism 135, the Small Catechism''s
  Fourth Petition, the Anglican Visitation of the Sick, and the Baptist Faith & Message III with the
  SBC 2013 mental-health resolution; borrowed fixed words for the storm (the Small Catechism''s daily
  prayers; the Anglican daily office and collects), and 1 Kings 19:4–8 (God tending the collapsed
  prophet with food and sleep) in the Anabaptist, Baptist, Lutheran, and Methodist columns. Two
  columns flag an internal variation (medication-wary or deliverance-only wings); the standards
  support prayer with medicine, and the ground truth crowns neither fringe.'
