locus_label: 'Exodus 20:16 (you shall not bear false witness) with Exodus 20:14 (adultery and false
  witness forbidden in the same breath of the law — the Anglican, Baptist, Methodist, and Pentecostal
  columns), Matthew 5:33–37 / James 5:12 (let your yes be yes and your no, no — the Anabaptist column''s
  oath articles), Ephesians 5:11 (take no part in the unfruitful works of darkness — the Anabaptist,
  Anglican, Baptist, Pentecostal, and Reformed columns), Proverbs 28:13 (concealing sin does not
  prosper — the Baptist and Pentecostal columns), and Galatians 6:1 (restore in gentleness — the
  Anabaptist, Lutheran, Pentecostal, and Reformed columns); the commandment against false witness
  admitting no benevolent lie — Luther''s Small Catechism (Eighth Commandment), Westminster Larger
  Catechism 144–145 and Heidelberg LD 43 (the strands number it the Eighth or the Ninth); marriage as
  covenant and the seventh-commandment duty of chastity — Luther''s Large Catechism, WLC 138–139, and
  BF&M XVIII; Proverbs 27:6 (the faithful wounds of a friend — the Anglican, Lutheran, and Methodist
  columns), with the Matthew 18 private-first order. Safety caveat: where the husband might turn
  violent, shape disclosure with a pastor or counsellor first (the Anglican and Anabaptist columns).'
