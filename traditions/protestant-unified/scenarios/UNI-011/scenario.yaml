locus_label: 'Matthew 5:42 (give to him that asketh thee) in the Anabaptist, Anglican, Baptist,
  Lutheran, Methodist, and Pentecostal columns, with the Reformed column grounding the same duty on
  Proverbs 19:17, Luke 6:30–36, and Galatians 6:9–10; and Proverbs 19:17 (whoever is kind to the poor
  lends to the LORD) in every column but the Anabaptist. The guilt of withholding help the neighbour''s
  body needed (Luther''s Fifth Commandment) and the best construction owed the neighbour — the "scam"
  verdict not yours to adopt on hearsay (Luther''s Eighth Commandment); the Samaritan''s hands-on
  mercy (Luke 10:33–35) and love in deed and truth (1 John 3:17–18). Alms commanded and ordered — the
  Anglican Article XXXVIII and the Homily of Alms-doing, the Baptist Faith & Message XIII, Westminster
  Larger Catechism 141 and Heidelberg LD 42, with the deacons'' office for the poor (Dordrecht Art. 9;
  Belgic Confession Art. 30 — mercy ordered, not improvised). If addiction is real, change the form of
  the gift, never the fact of it.'
