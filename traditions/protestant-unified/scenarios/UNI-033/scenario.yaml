locus_label: '1 Timothy 5:8 (providing for one''s own household as a binding duty — the Anglican,
  Lutheran, Methodist, Pentecostal, and Reformed columns, with BF&M XVIII in the Baptist column) with
  1 John 4:1 (test the spirits — six columns, all but the Reformed), 1 Thessalonians 5:20–21 (prove
  all things, hold the good — the Pentecostal column), Proverbs 15:22 / 11:14 (safety in an abundance
  of counsellors — every one of the seven columns), James 1:27 (visiting orphans is pure religion — the
  Baptist, Lutheran, and Reformed columns), and 1 Peter 3:7 with Genesis 2:24 (heirs together; the
  one-flesh covenant, so the wife''s voice is intrinsic — the Anabaptist and Pentecostal columns); the
  sufficiency of Scripture over private impressions — the Smalcald Articles against "enthusiasm" (the
  Lutheran column), Article VI (the Anglican column), BF&M I (the Baptist column), the WCF on Scripture
  (the Reformed column), and Wesley''s The Nature of Enthusiasm (the Methodist column). The impression
  is neither called demonic nor the mercy misguided; the wife''s terror is treated as data and the
  call tested by staged, part-time obedience while employed.'
