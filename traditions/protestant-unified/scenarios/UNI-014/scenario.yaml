locus_label: 'Luke 15:20 (the father saw him a great way off and ran) and Luke 5:29–32 (Christ at
  table with those he was winning — presence as pursuit, not endorsement); with 1 Corinthians
  5:9–12 (the church judges its own members, not those outside) and Romans 2:4 (the goodness of God
  leads to repentance); the marriage standards held without crowning attendance — the Baptist Faith
  & Message XVIII (the family), Luther''s Sixth Commandment, Heidelberg Catechism LD 41, and the
  Anglican marriage rite; Ephesians 4:15 (the truth spoken in love, once). The Pentecostal column is
  silent on attendance; the envelope of attend-or-decline-the-event is named, crowning no wing.'
