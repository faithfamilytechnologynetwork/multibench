locus_label: 'Exodus 20:3 (the First Commandment — no other gods) as the confessions expound it:
  whatever the heart clings to and relies upon is its god, Mammon the most common idol (Luther''s
  Large Catechism, First Commandment); the inordinate setting of mind, will, and affections upon
  other things (Westminster Larger Catechism 105); the Anglican Catechism''s duty to put one''s whole
  trust in God. With Mark 8:36 (gain the world, forfeit the soul), cited in every column but the
  Lutheran, and the bigger barns of Luke 12:15–21. The parents'' office — Deuteronomy 6:6–7 and
  Ephesians 6:4 across the Baptist, Lutheran, Methodist, Pentecostal, and Reformed columns; WLC 129
  and Luther''s Fourth Commandment and Table of Duties on parents'' presence and instruction; Psalm
  127:1–2 and the Westminster Confession on the weekly rest; the Baptist Faith & Message XVIII and
  the Anglican marriage rite and Homily on Matrimony. Confession and absolution: Augsburg Confession
  XI.'
