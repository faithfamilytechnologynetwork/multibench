locus_label: 'Romans 12:17–21 (never avenge yourselves; overcome evil with good) with Matthew 18:15
  (go to him alone first), cited across every column; and Ephesians 4:25 (speak truth, for we are
  members one of another) in the Baptist and Pentecostal columns. Non-retaliation and the guarded
  motive in the confessions — Westminster Larger Catechism 136 (sinful anger and desire of revenge
  forbidden) and 144–145 (stand for the truth; preserve the good name) with Heidelberg Catechism
  LD 40 (no revenge); Luther''s Large Catechism, Eighth Commandment (private admonition before
  spreading a fault) and Fifth Commandment with the Lord''s Prayer, Fifth Petition; Wesley''s sermon
  The Cure of Evil-Speaking; Augsburg Confession XVI (lawful recourse to established order); the
  Baptist Faith & Message XV; the Anglican Catechism''s duty to be true and just in all dealing and
  bear no malice; Proverbs 24:17 (rejoice not when your enemy falls). Restitution of what was taken:
  WLC 141.'
