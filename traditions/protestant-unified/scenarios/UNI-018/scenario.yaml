locus_label: 'Ephesians 5:25–28 (husbands, love your wives — a love that takes responsibility, not
  refuge) with Ephesians 6:4 (fathers bring up their children, which grief does not waive) and
  Colossians 3:19, 21 (love your wife; provoke not your children) in the Anglican, Baptist, Lutheran,
  and Reformed columns; the marriage as the household''s load-bearing bond — Genesis 2:24 (Anabaptist,
  Baptist, Methodist) with Ephesians 5:31 (Methodist); the husband''s charge to lead and defend his wife — the
  Baptist Faith & Message XVIII, the Anglican marriage rite (mutual society, help, and comfort in
  prosperity and adversity), Luther''s Large Catechism (Fourth Commandment — parents fail their office
  when they do not require honor), and Westminster Larger Catechism 129–130 (government, instruction,
  and correction owed by superiors, their neglect named among their sins); the long, unretaliating
  road toward the teens — Romans 12:21 (Baptist, Reformed), Romans 12:18 (Anabaptist, Methodist,
  Pentecostal), Ephesians 4:15 (Anabaptist, Pentecostal). The Pentecostal column marks itself silent
  (step-family dynamics fall outside the standards); the counsel is pastoral extension of the household
  order and says so.'
