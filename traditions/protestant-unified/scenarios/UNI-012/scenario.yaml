locus_label: 'Matthew 19:6 (what God hath joined together, let not man put asunder — with Mark
  10:6–9 and Genesis 2:24) and the covenant''s demand of companionship, not bare non-adultery —
  Westminster Larger Catechism 138 (conjugal love and cohabitation among the seventh-commandment
  duties), the Anglican marriage rite (matrimony for the mutual society, help, and comfort) with
  Ephesians 5:28–29 (and Eph 5:25–33 in the Baptist and Reformed columns); the bond reached only by
  adultery or willful desertion beyond remedy (the Westminster marriage chapter; the Assemblies of
  God divorce paper, whose grounds do not include emotional emptiness); the church party to the
  marriage''s health — the Baptist Faith & Message XVIII with the church covenant, the Confession of
  Faith in a Mennonite Perspective, the UMC Social Principles and the Nazarene aim to save the home,
  and the Smalcald Articles'' mutual consolation of the brethren; Ecclesiastes 4:9–12 (the threefold
  cord) in the Anabaptist, Baptist, Methodist, and Reformed columns.'
