locus_label: '1 Corinthians 7:39 (marriage entered only in the Lord) and 2 Corinthians 6:14 (be ye
  not unequally yoked together with unbelievers) — both across all seven columns — with Amos 3:3
  (can two walk together, except they be agreed?) in the Baptist, Methodist, and Pentecostal
  columns, and the distinction that 1 Corinthians 7:12–16 (the unbelieving spouse sanctified) speaks
  to remaining in a marriage, not entering one (the Anglican, Baptist, Lutheran, and Pentecostal
  columns); marriage as whole-life union with a shared Lord — Genesis 2:18, 24 and Ephesians 6:4
  (Reformed), the marriage rite as worship signifying Christ and his Church (Anglican), the head of
  household teaching the faith (Luther''s Small and Large Catechisms), and the confessions'' "marry
  in the Lord, not with unbelievers" — the Dordrecht Confession, the Second London Confession''s
  chapter on marriage, and the Westminster marriage chapter; consult the brethren before any step
  toward marriage (the Methodist Large Minutes). Four columns flag an advice-versus-line variation;
  the shared cautionary core is the ground truth, crowning neither the forbidden nor the permitted
  wing.'
