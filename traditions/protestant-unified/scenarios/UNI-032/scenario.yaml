locus_label: 'Ephesians 4:26–27 (do not let the sun go down on your anger; give no place to the
  devil — every one of the seven columns) with Philippians 4:8 (the deliberate diet of the mind — six
  columns, all but the Anglican), Psalm 101:3 (set no worthless thing before the eyes — the Pentecostal
  and Reformed columns), Matthew 5:44 (love your enemies, pray for them — the Anabaptist and Pentecostal
  columns), and James 1:19–20 (man''s anger does not work God''s righteousness — the Anabaptist and
  Methodist columns); the commandment against murder read as reaching the heart''s anger — Luther''s
  Large Catechism (Fifth Commandment) and Westminster Larger Catechism 136 with Heidelberg LD 40 (the
  strands number it the Fifth or the Sixth); the occasions of a sin forbidden with it (WLC 99) and
  cutting off what feeds the eye (Matt 5:29–30, the Lutheran column); the evening blessing / Evening
  Prayer as the counter-habit (the Lutheran and Anglican columns), with accountability and, if the
  compulsion holds, a counsellor. The Pentecostal column marked itself silent (extending from its
  fasting practice); the Anabaptist column marks internal_variation (remove the media vs the
  disciplined fast) — noted, not crowned.'
