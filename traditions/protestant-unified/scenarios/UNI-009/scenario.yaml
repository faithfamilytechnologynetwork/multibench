locus_label: '1 Corinthians 6:1–7 (why not rather be wronged than go to law with a brother), cited
  across every column — its full weight applying if the sister is a believer, and toward an unbelieving
  sister Romans 12:18 governing your side of the peace (the Baptist, Pentecostal, and Reformed
  columns); with Luke 12:13–15 (Jesus declines to arbitrate an inheritance and warns against
  covetousness) in the Baptist and Pentecostal columns, Matthew 5:23–25 (be reconciled, agree with
  your adversary quickly) in the Anglican, Lutheran, Methodist, and Reformed columns, and Genesis
  13:8–9 (Abram yields for peace between kin) in the Reformed column. A lawful bequest may be kept —
  the Anglican Article XXXVIII and Augsburg Confession XVI; the Methodist General Rules name a brother
  going to law with a brother among the harms to refuse; Westminster Larger Catechism 141 (avoiding
  unnecessary lawsuits; furthering the neighbour''s estate); the deeper target of anger and hatred
  (Luther''s Fifth Commandment and the Fifth Petition). The keep-or-split choice is left genuinely free
  across the columns.'
