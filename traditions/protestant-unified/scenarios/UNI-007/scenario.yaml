locus_label: 'Ephesians 4:25 (put away lying, speak truth, for we are members one of another), cited
  in every column; with Proverbs 28:13 and Psalm 32:3–5 (the cost of kept silence, the mercy after
  confession) in the Baptist column, and the one-flesh covenant that admits no hidden second ledger —
  Genesis 2:24 / Mark 10:8 in the Anabaptist, Methodist, and Pentecostal columns, the Westminster
  Confession on marriage in the Reformed, and Luther''s Eighth Commandment (the spouse the nearest
  neighbour); James 5:16 (confess one to another) in the Methodist, Pentecostal, and Reformed columns.
  Confession with amendment and restitution — the Anglican marriage rite (for richer for poorer) and
  Communion exhortation; Augsburg Confession XI–XII; the Westminster Confession on repentance declared
  to the party offended; the Baptist Faith & Message XVIII; the Anabaptist Confession of Faith in a
  Mennonite Perspective, Art. 20. Every column attaches a safety caveat: where violence is feared,
  plan the disclosure from safety with a pastor and appropriate professional help before telling.'
