locus_label: 'Proverbs 31:8–9 (open your mouth for those who cannot speak for themselves), grounding
  the duty in every column but the Lutheran, which carries it on the commandments; with Westminster
  Larger Catechism 145 (condemning undue silence in a just cause, and holding our peace when iniquity
  calls for reproof or complaint) and 144 (defending the innocency of others) and 130 (superiors
  abusing power to the hurt of those under them); the Anglican General Confession (things left undone
  confessed as sin — omission is not neutrality); Luther''s Large Catechism, Fifth Commandment (guilt
  for failing to help and defend the neighbour) and Eighth Commandment (private admonition before
  public); Wesley''s The Cure of Evil-Speaking and "no holiness but social holiness"; the Baptist
  Faith & Message XV (standing for the wronged and abused). The fear of man as a snare, and God as
  provider: Proverbs 29:25, Matthew 6:26, 31–33, Luther''s First Commandment and Fourth Petition,
  Heidelberg Catechism LD 9–10, and Acts 4:29–31.'
