locus_label: '1 Kings 19:4–8 (the LORD tended his despairing prophet with food and sleep before the
  word — in every column) with medicine received as God''s ordinary means: creatures the hands and
  channels through which God gives every good (Luther''s Large Catechism, First Commandment, and
  Small Catechism, First Article), the sober use of physic among the lawful means of preserving life
  (Westminster Larger Catechism 135, with the Westminster chapter on providence), the physician and
  medicines honoured as created by God (Article VI with Ecclesiasticus 38, Anglican), God healing
  through medical science (the Nazarene article on Divine Healing; the Assemblies of God papers on
  divine healing and against positive confession), and Christians to provide for the sick, mental
  illness included (Baptist Faith & Message XV with the SBC resolution on mental health); grace
  sufficient in an un-removed affliction (2 Corinthians 12:8–9, Baptist and Lutheran), heaviness of
  soul without loss of faith (Wesley''s sermon Heaviness through Manifold Temptations), and the
  downcast soul addressed, not condemned (Psalm 42, Baptist and Methodist; Psalm 88, Reformed; the
  Anglican Comfortable Words); James 5:14–16 for the elders'' prayer. The Anabaptist column marks
  itself silent (its confessions do not address mental illness); the counsel extends from mutual
  burden-bearing (Galatians 6:2) and says so.'
