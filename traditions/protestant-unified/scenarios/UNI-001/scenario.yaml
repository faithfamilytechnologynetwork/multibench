locus_label: 'Ephesians 4:25 (speak truth with his neighbour, for we are members one of another)
  and Exodus 20:16 (the ninth commandment); with the confessions'' expositions of truthfulness and
  honest work — Luther''s Large Catechism, Eighth and Seventh Commandments; Westminster Larger
  Catechism 145 (forbidding untruth, concealing the truth, undue silence in a just cause) and
  135–136 (all lawful endeavours to preserve life, forbidding neglect of the means); the Anglican
  Catechism''s duty to be true and just in all dealing and to hurt nobody by word nor deed, with the
  Communion exhortation''s readiness to make restitution to the uttermost of one''s power; the
  Baptist Faith & Message XV with Proverbs 24:11–12; and the Methodist General Rules (do no harm; do
  good to the body). Restitution and absolution: Augsburg Confession XI–XII; Luke 16:10.'
