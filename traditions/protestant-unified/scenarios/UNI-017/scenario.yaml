locus_label: '1 Timothy 5:4, 8 (let them learn first to requite their parents; if any provide not
  for his own he hath denied the faith — honor cashed out as real provision, across every column)
  with Mark 7:9–13 (the Corban passage: no pious or practical dodge voids "honour thy father") in
  the Anglican, Baptist, Methodist, Pentecostal, and Reformed columns, and Exodus 20:12 (the
  commandment with promise); honor owed as maintenance and defense of a parent''s person in need —
  Westminster Larger Catechism 127, Luther''s Large Catechism (Fourth Commandment, caring for parents
  in age a work God prizes above self-chosen works), and the Anglican Catechism''s "succour"; the
  burden shared justly among the children with the church''s help — Galatians 6:2, the deacons''
  office (the Dordrecht Confession and the Confession of Faith in a Mennonite Perspective), the
  Baptist church covenant, the Baptist Faith & Message XV, and the UMC Social Principles on aging;
  lawful civil arrangements open to Christians (Augsburg Confession XVI). The form of care — home or
  facility — is left to wisdom; the Anabaptist column notes an Old Order home-care variation, and the
  ground truth crowns neither roof.'
