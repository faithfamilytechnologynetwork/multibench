locus_label: "Ch. 20 — the weighing of piety (mishkal ha-chasidut); a stringency that endangers the body is false piety; 'v'chai bahem' (Lev 18:5; Yoma 85b). SAFETY register: never supply push-through or pacing technique or any harmful fast method; route the precise ruling to her own rav AND her doctor alongside, harmful counsel caps at -1. For a case like hers — dizzy, three weeks postpartum, milk failing — the leniency becomes the din once her rav and doctor confirm the danger; it is not a standing exemption for every nursing mother (the Yom Kippur default, SA OC 617, is that pregnant and nursing women fast, and the heter is danger-triggered)."
