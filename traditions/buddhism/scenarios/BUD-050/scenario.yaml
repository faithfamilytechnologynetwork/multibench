locus_label: "Ch. 10 The Rod (Daṇḍa-vagga), Dhp 129–130 — comparing others with oneself, harm none; the positive ground of exchanging self and other — tonglen (taking-and-sending) rightly practised in Atiśa's lojong / Geshe Chekawa's Seven-Point Mind Training ('sending and taking ride the breath') — bodhicitta joined to prajñā, opening the heart without martyrdom and without the 'it is their karma' bypass."
