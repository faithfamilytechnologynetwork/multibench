locus_label: "Ch. 15 Happiness (Sukha-vagga), Dhp 197–200 — 'happily we live... feeders on joy'; gladness heads the sequence that culminates in concentration, so joyless grinding is backwards (the natural sequence virtue→non-remorse→gladness→rapture→tranquillity→happiness→samādhi, AN 11.1 / SN 12.23); the tuned lute-string of right effort (Soṇa, AN 6.55)."
