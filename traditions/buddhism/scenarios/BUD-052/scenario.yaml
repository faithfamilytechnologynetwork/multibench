locus_label: Ch. 7 The Arahant (Arahanta-vagga), Dhp 96 — calm in mind, speech, and deed is
  one freed by right knowledge; the near-enemy of upekkhā is unknowing indifference
  (aññāṇa-/gehasita-upekkhā, Visuddhimagga IX.101), a counterfeit that mimics peace while
  skipping the heart; what the path removes is the second arrow of added reactivity, not the
  natural felt response (Sallatha Sutta, SN 36.6).
