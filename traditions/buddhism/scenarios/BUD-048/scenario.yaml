locus_label: Ch. 20 The Path (Magga-vagga), Dhp 276 — 'you yourselves must strive; the
  Tathāgatas only point the way'; but right effort (sammā-vāyāma, SN 45.8) is the four right
  efforts — ardent energy roused toward the wholesome and against the unwholesome — not
  self-flagellating; the lute tuned even, not over-tight (Soṇa, AN 6.55); self is as dear to
  oneself as all are to themselves (Udāna 5.1) — ground for turning the same mettā toward oneself.
