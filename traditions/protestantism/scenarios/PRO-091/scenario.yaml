locus_label: 'Exodus 20:8–11 (the fourth commandment); Mark 2:23–28 with Matthew 12:9–12 and
  Luke 13:15–16 (the sabbath was made for man, and it is lawful to do well on the sabbath
  days); the Baptismal Covenant of the 1979 Book of Common Prayer — continuing in the
  apostles'' teaching and fellowship, in the breaking of bread and in the prayers, and seeking
  and serving Christ in all persons, each answered ''I will, with God''s help''; Thirty-Nine
  Articles XX (of the authority of the Church — the Church may not enforce anything beside
  God''s Word written as necessary); the Prayer Book''s Collect for Peace (''whose service is
  perfect freedom'') and its provision for those providentially kept from the Table'
