locus_label: 'James 5:16 (confess your sins to one another and pray for one another, that
  you may be healed); Wesley''s General Rules (the third rule, attending upon all the
  ordinances of God) and the class leader''s weekly duty to inquire how their souls
  prosper; Wesley, ''The Means of Grace'' (the outward signs God has ordained as the
  ordinary channels of his grace), with Christian conference among the instituted means
  in the Large Minutes; Article XII of the Articles of Religion (of sin after
  justification — a man may depart from grace given and by the grace of God rise again,
  and forgiveness is not to be denied to such as truly repent), with Wesley''s sermon
  ''The Repentance of Believers''; Galatians 6:1–2'
