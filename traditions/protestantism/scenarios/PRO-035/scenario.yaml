locus_label: 'Leviticus 19:33–34 (the sojourner among you shall be as the native, and you
  shall love him as yourself); Isaiah 1:17; the Belhar Confession (a binding confession in the
  churches that have adopted it as a standard — URCSA, the Uniting Presbyterian churches, the
  RCA — and received elsewhere as a testimony rather than a fourth form of unity; bind it only
  where the person''s church holds it) on God as the God of the destitute, the poor and the
  wronged; Abraham Kuyper (an influential voice in this tradition''s public theology, never a
  confessional standard and never binding on a conscience) on the social question; Belgic
  Confession on civil authority'
