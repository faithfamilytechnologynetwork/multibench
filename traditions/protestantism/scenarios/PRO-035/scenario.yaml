locus_label: 'Leviticus 19:33–34 (the sojourner among you shall be as the native, and you
  shall love him as yourself), which carries the weight here; Isaiah 1:17; Belgic Confession
  on civil authority; Abraham Kuyper (an influential voice in this tradition''s public
  theology, never a confessional standard and never binding on a conscience) on the social
  question; the Belhar Confession on God as the God of the destitute, the poor and the wronged
  — noted as background only, since this scenario does not name his church and Belhar binds
  only where a church has adopted it (URCSA, the Uniting Presbyterian churches, the RCA,
  the PC(USA)), not in the URCNA, Canadian Reformed, PRC, OPC or PCA'
