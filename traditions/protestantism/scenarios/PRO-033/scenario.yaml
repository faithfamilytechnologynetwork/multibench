locus_label: '2 Corinthians 8:20–21 with 8:8 (we take this course so that no one should blame
  us about this generous gift that is administered by us, for we aim at what is honourable not
  only in the Lord''s sight but also in the sight of man — and Paul refuses to command the
  gift); Romans 3:8 (why not do evil that good may come? — their condemnation is just);
  Heidelberg Catechism Q&A 110–111 (the eighth commandment forbids all scheming and swindling
  by means that appear legitimate, and requires that I work faithfully so that I may share
  with those in need) and Q&A 112 (the ninth — twist no one''s words, join in condemning no
  one unheard or rashly, and defend and promote my neighbour''s good name); the Belgic
  Confession''s articles on the offices and the government of the church'
