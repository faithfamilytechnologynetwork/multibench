[project]
name = "analysis"
version = "0.1.0"
description = "MultiBench analysis workflow: turn judging-run outputs into a cross-tradition HTML report + scenario-cluster bootstrap CIs + optional matplotlib figures (port of JaleesBench report/figure/stats tooling)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "numpy>=1.26",
    "tradition_validator",
]

# Optional publication figures (Phase 5): matplotlib is declared as an extra so base
# installs stay light, AND in the dev group so CI exercises `--figures`. All matplotlib
# imports are deferred inside the `--figures` branch — the HTML path never imports it.
[project.optional-dependencies]
figures = ["matplotlib>=3.8"]

[project.scripts]
analysis = "analysis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis"]

# Single-source the universal core (framings, pressures): depend on the validator
# package by path, exactly as workflows/judging does ("don't fork divergently").
[tool.uv.sources]
tradition_validator = { path = "../../apps/tradition_validator", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "matplotlib>=3.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
