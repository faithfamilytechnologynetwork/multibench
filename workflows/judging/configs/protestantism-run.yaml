# ProtestantBench benchmark round (issue #89) — dual-judged, full roster.
#
# Derived from the 20260803 benchmark-of-record run (NOT from docs):
#   - subjects + Gemini judge path: workflows/judging/configs/openrouter-funded-run.yaml
#   - dual-judge shape: results/20260803/manifest.json (judges: gemini full_grid + opus validation)
#   - Opus judge is DIRECT anthropic (ANTHROPIC_API_KEY), matching the record's
#     tmp/judging-runs/20260803-unstated-opus (judge id `claude-opus-4-8`).
#
# Keys: OPENROUTER_API_KEY (subjects + Gemini judge) and ANTHROPIC_API_KEY (Opus judge) ONLY —
# sourced from /Users/mwk/Development/fftn/taqwabench/.env. Never a personal Gemini key.
#
# This single config carries BOTH judges — used as-is for the SMOKE (`run --scenarios 2`,
# both judges full over 2 whole scenarios). The full run splits Gemini (full grid) from Opus
# (validation coverage) into separate passes; see the run notes / smoke report.

subjects:
  # GPT-5.6 Terra — OpenRouter billed 1.00/6.00 (50%-off promo; standard 2.00/12.00).
  - {model: openai/gpt-5.6-terra, provider: openai, base_url: https://openrouter.ai/api/v1, api_key_env: OPENROUTER_API_KEY}
  # Claude Sonnet 5 — OpenRouter billed 2.00/10.00 (intro; standard 3.00/15.00).
  - {model: anthropic/claude-sonnet-5, provider: openai, base_url: https://openrouter.ai/api/v1, api_key_env: OPENROUTER_API_KEY}
  # Gemini 3.6 Flash — 1.50/7.50.
  - {model: google/gemini-3.6-flash, provider: openai, base_url: https://openrouter.ai/api/v1, api_key_env: OPENROUTER_API_KEY}
  # Qwen3-235B-A22B-Instruct-2507 — 0.15/0.60 (routed-host default; host-dependent).
  - {model: qwen/qwen3-235b-a22b-2507, provider: openai, base_url: https://openrouter.ai/api/v1, api_key_env: OPENROUTER_API_KEY}
  # Inkling — 1.00/4.05, on OpenRouter (routes through the funded key).
  - {model: thinkingmachines/inkling, provider: openai, base_url: https://openrouter.ai/api/v1, api_key_env: OPENROUTER_API_KEY}

judges:
  # Gemini 3.6 Flash — ranking judge, FULL GRID. Via OpenRouter, safety-ON (record decision
  # 2026-08-03: OpenRouter can't forward Google BLOCK_NONE; refusals surface as failed cells).
  - {model: google/gemini-3.6-flash, provider: openai, base_url: https://openrouter.ai/api/v1, api_key_env: OPENROUTER_API_KEY, safety_off: false}
  # Opus 4.8 — validation judge (full_grid: false in the export layer). Direct Anthropic key.
  # max_tokens 8000 (up from the 4096 default): the smoke saw ~1% Opus cells truncate
  # ("Unterminated string") because thinking + the JSON verdict overran 4096 (#89 architect go).
  - {model: claude-opus-4-8, provider: anthropic, thinking: true, max_tokens: 8000}

# Full framings sweep — unstated / stated / guided.
framings: [unstated, stated, guided]
# Six universal pressures (default set); both scopes (turn1, full); concurrency 8; retries 2.
