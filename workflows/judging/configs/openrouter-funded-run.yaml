# Funded-run configuration — subjects + the Opus judge on the pre-funded OpenRouter key (issue #43).
#
# Provider path: the generic OpenAI-chat-completions seam (#41), pointed at OpenRouter — no new
# provider code: `provider: openai` + `base_url` + `api_key_env`.
#
#   env: OPENROUTER_API_KEY   (fail-fast if missing — no fallback, baked decision)
#   base_url: https://openrouter.ai/api/v1
#
# Prices are the CURRENT OpenRouter-BILLED rates from the live models API (openrouter.ai/api/v1/models,
# 2026-08-03), cited per-slug in report.py PRICES. OpenRouter forwards Anthropic prompt-cache READS
# (priced 0.1x); the judge path sends the two 1h cache_control breakpoints (static rubric + per-scenario
# anchor) so Opus judging is not billed full input price on re-reads. Cache WRITES are under-reported on
# this path (see the _openai_usage note) — cost lines are a funded-run ESTIMATE, not invoice-exact.
# OpenAI/Gemini auto-cache on their own.
#
# GEMINI JUDGE — NOT on OpenRouter (deliberate). The Gemini judge must run safety-off (BLOCK_NONE) so it
# does not refuse benign-but-sensitive transcripts (spec §5.5), but OpenRouter exposes no Google
# safety-settings passthrough, so the openai-compat path fails loud on safety_off. The Gemini judge
# therefore uses the DIRECT `gemini` provider, honoring BLOCK_NONE — it bills to GEMINI_API_KEY / Vertex,
# NOT the OpenRouter funded key. (The `google/gemini-3.6-flash`-as-OpenRouter-judge path is still proven
# by the live smoke; it is just not spec-usable for the real run because of safety-off.)
#
# Serving-host routing / pinning: OpenRouter routes to an available host by default. For Qwen the
# effective rate is HOST-DEPENDENT (0.15/0.60 is the models-API top-level default on 2026-08-03).
# Deterministic host pinning is NOT expressible in the current config schema (no provider-routing field)
# — a small follow-up if the funded run needs a fixed host, out of scope for #43.
#
# CROSS-RUN COMPARABILITY: report/cost keys are the OpenRouter SLUGS (e.g. `anthropic/claude-opus-4.8`,
# `openai/gpt-5.6-terra`), which differ from direct-provider model strings (`claude-opus-4-8`,
# `gpt-5.6-terra`). Reports from this run key subjects/judges by slug — don't expect row-key identity
# with earlier direct-provider runs when diffing report.json.
#
# The batch judging path (OpenRouter Batch API, ~50% off) is issue #44 — NOT configured here.

subjects:
  # GPT-5.6 Terra — current billed 1.00/6.00 (50%-off promo; standard 2.00/12.00).
  - {model: openai/gpt-5.6-terra, provider: openai, base_url: https://openrouter.ai/api/v1, api_key_env: OPENROUTER_API_KEY}
  # Claude Sonnet 5 — current billed 2.00/10.00 (intro; standard 3.00/15.00).
  - {model: anthropic/claude-sonnet-5, provider: openai, base_url: https://openrouter.ai/api/v1, api_key_env: OPENROUTER_API_KEY}
  # Gemini 3.6 Flash — 1.50/7.50.
  - {model: google/gemini-3.6-flash, provider: openai, base_url: https://openrouter.ai/api/v1, api_key_env: OPENROUTER_API_KEY}
  # Qwen3-235B-A22B-Instruct-2507 — 0.15/0.60 (routed-host default; host-dependent).
  - {model: qwen/qwen3-235b-a22b-2507, provider: openai, base_url: https://openrouter.ai/api/v1, api_key_env: OPENROUTER_API_KEY}
  # Inkling — 1.00/4.05. It IS on OpenRouter (contrary to the issue's "may not be"), so it routes
  # through the funded key too rather than the direct Tinker provider.
  - {model: thinkingmachines/inkling, provider: openai, base_url: https://openrouter.ai/api/v1, api_key_env: OPENROUTER_API_KEY}

judges:
  # Gemini 3.6 Flash judge — DIRECT gemini provider, safety-off (see the GEMINI JUDGE note above:
  # OpenRouter can't forward Google safety-settings, and the openai path fails loud on safety_off).
  # Bills to GEMINI_API_KEY / Vertex, not the OpenRouter key.
  - {model: gemini-3.6-flash, provider: gemini, safety_off: true}
  # Opus 4.8 judge — anthropic/claude-opus-4.8 (5.00/25.00) via OpenRouter; cache_control breakpoints
  # forwarded automatically by the openai judge path (issue #43 §3). thinking is ON (reasoning forwarded).
  - {model: anthropic/claude-opus-4.8, provider: openai, base_url: https://openrouter.ai/api/v1, api_key_env: OPENROUTER_API_KEY}

# Full framings sweep (the funded run's "framings expansion") — unstated / stated / guided.
framings: [unstated, stated, guided]
